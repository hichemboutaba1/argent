<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniStream — Rechercher</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span>Ani<span class="logo-accent">Stream</span></span>
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="browse.html">Catalogue</a>
    </div>
    <div class="nav-actions">
      <button class="btn-primary" onclick="showComingSoon()">Connexion</button>
    </div>
  </nav>

  <main class="main-content" style="padding-top:100px">
    <div class="search-page">
      <h1 class="search-heading">Rechercher un anime</h1>
      <div class="search-bar-big">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Ex: Naruto, Attack on Titan, Demon Slayer..."
          autofocus
        />
        <button id="searchBtn" onclick="doSearch()">Rechercher</button>
      </div>

      <div class="search-filters">
        <select id="filterType" onchange="doSearch()">
          <option value="">Tous les types</option>
          <option value="tv">Série TV</option>
          <option value="movie">Film</option>
          <option value="ova">OVA</option>
          <option value="special">Spécial</option>
        </select>
        <select id="filterStatus" onchange="doSearch()">
          <option value="">Tous les statuts</option>
          <option value="airing">En cours</option>
          <option value="complete">Terminé</option>
          <option value="upcoming">À venir</option>
        </select>
        <select id="filterOrder" onchange="doSearch()">
          <option value="score">Note</option>
          <option value="popularity">Popularité</option>
          <option value="title">Titre</option>
        </select>
      </div>

      <div id="searchStatus" class="search-status"></div>

      <div class="cards-grid search-results" id="searchResults">
        <!-- Popular searches shown by default -->
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 AniStream. Données fournies par <a href="https://jikan.moe" target="_blank">Jikan API</a>.</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
